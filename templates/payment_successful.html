<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemax - Payment Successful</title>
    <style>
        /* Copy your existing styles */
        body {
            width: 1920px;
            margin: 0 auto;
            background: #0a0c0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding: 40px 80px 60px;
            background: linear-gradient(180deg, #0a0c0f 0%, #14181c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: linear-gradient(145deg, #1e2429, #14181c);
            border-radius: 30px;
            padding: 60px;
            max-width: 600px;
            text-align: center;
            border: 1px solid #2a3138;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, #4CAF50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .booking-ref {
            background: #1a1e24;
            padding: 20px;
            border-radius: 12px;
            margin: 30px 0;
            border: 2px dashed #4CAF50;
        }

        .ref-number {
            font-size: 32px;
            color: #4CAF50;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .btn {
            background: #e50914;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:hover {
            background: #ff0f1a;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h1>Payment Successful!</h1>
            <p style="color: #999; font-size: 18px; margin-bottom: 30px;">
                Your payment has been processed successfully.
            </p>

            <div class="booking-ref">
                <div style="color: #999; margin-bottom: 10px;">Booking Reference</div>
                <div class="ref-number">{{ booking.booking_reference }}</div>
            </div>

            <p style="color: #999; margin-bottom: 30px;">
                A confirmation email has been sent to your registered email address.
            </p>

            <a href="/" class="btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
