<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Cinemax</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0c0f 0%, #14181c 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            max-width: 500px;
            text-align: center;
            background: rgba(26, 30, 36, 0.95);
            border-radius: 24px;
            padding: 50px 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.5);
            animation: slideUp 0.5s ease;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #4caf50;
        }

        p {
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .booking-ref {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: #e50914;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #ff0f1a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #2a3138;
        }

        .btn-secondary:hover {
            background: #3a414a;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1>Payment Successful!</h1>
        <p>Your booking has been confirmed. A confirmation email has been sent to your registered email address.</p>

        <div class="booking-ref">
            <strong>Booking Reference:</strong><br>
            <span style="font-size: 20px; color: #e50914;">{{ booking_reference }}</span>
        </div>

        <a href="{{ url_for('my_bookings') }}" class="btn">View My Bookings</a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
    </div>
</body>
</html>
