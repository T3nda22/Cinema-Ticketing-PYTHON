<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cinemax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h2 {
            color: #667eea;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .password-requirements {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
        .requirement {
            margin: 5px 0;
        }
        .requirement.valid {
            color: #28a745;
        }
        .requirement.invalid {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">
            <h2>Cinemax</h2>
            <p class="text-muted">Reset Your Password</p>
        </div>

        <div id="alertMessage" style="display: none;" class="alert"></div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required
                       placeholder="Enter your registered email">
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" required>
                <div class="password-requirements">
                    <div class="requirement" id="lengthReq">✓ At least 8 characters</div>
                    <div class="requirement" id="letterReq">✓ Contains letters (A-Z, a-z)</div>
                    <div class="requirement" id="numberReq">✓ Contains numbers (0-9)</div>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                <small class="form-text text-muted" id="matchMsg"></small>
            </div>

            <button type="submit" class="btn btn-primary btn-reset" id="submitBtn" disabled>
                Reset Password
            </button>
        </form>

        <div class="back-to-login">
            <a href="{{ url_for('signin') }}" class="text-decoration-none">
                ← Back to Login
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let isPasswordValid = false;

        function validatePassword() {
            const password = $('#new_password').val();
            const lengthReq = $('#lengthReq');
            const letterReq = $('#letterReq');
            const numberReq = $('#numberReq');

            const lengthValid = password.length >= 8;
            lengthReq.removeClass('valid invalid');
            lengthReq.addClass(lengthValid ? 'valid' : 'invalid');

            const hasLetter = /[A-Za-z]/.test(password);
            letterReq.removeClass('valid invalid');
            letterReq.addClass(hasLetter ? 'valid' : 'invalid');

            const hasNumber = /[0-9]/.test(password);
            numberReq.removeClass('valid invalid');
            numberReq.addClass(hasNumber ? 'valid' : 'invalid');

            isPasswordValid = lengthValid && hasLetter && hasNumber;
            return isPasswordValid;
        }

        function validateConfirmPassword() {
            const password = $('#new_password').val();
            const confirm = $('#confirm_password').val();
            const matchMsg = $('#matchMsg');

            if (confirm.length > 0) {
                if (password === confirm) {
                    matchMsg.html('✓ Passwords match').css('color', '#28a745');
                    return true;
                } else {
                    matchMsg.html('✗ Passwords do not match').css('color', '#dc3545');
                    return false;
                }
            } else {
                matchMsg.html('');
                return false;
            }
        }

        function updateSubmitButton() {
            const passwordValid = validatePassword();
            const confirmValid = validateConfirmPassword();
            const emailValid = $('#email').val().length > 0;
            const allValid = passwordValid && confirmValid && emailValid && $('#confirm_password').val().length > 0;

            $('#submitBtn').prop('disabled', !allValid);
        }

        $('#email').on('keyup', updateSubmitButton);
        $('#new_password').on('keyup', function() {
            validatePassword();
            if ($('#confirm_password').val().length > 0) {
                validateConfirmPassword();
            }
            updateSubmitButton();
        });

        $('#confirm_password').on('keyup', function() {
            validateConfirmPassword();
            updateSubmitButton();
        });

        $('#resetPasswordForm').on('submit', function(e) {
            e.preventDefault();

            if (!isPasswordValid) {
                $('#alertMessage').removeClass('alert-success').addClass('alert-danger');
                $('#alertMessage').html('<strong>Error!</strong> Password does not meet requirements.');
                $('#alertMessage').fadeIn();
                setTimeout(() => $('#alertMessage').fadeOut(), 3000);
                return;
            }

            const submitBtn = $('#submitBtn');
            const originalText = submitBtn.html();

            submitBtn.html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Resetting...');
            submitBtn.prop('disabled', true);

            // First, verify email exists
            $.ajax({
                url: '{{ url_for("reset_password") }}',
                method: 'POST',
                data: { email: $('#email').val() },
                success: function(response) {
                    if (response.success) {
                        // Email verified, now update password directly
                        $.ajax({
                            url: '{{ url_for("update_password_direct") }}',
                            method: 'POST',
                            data: {
                                email: $('#email').val(),
                                new_password: $('#new_password').val(),
                                confirm_password: $('#confirm_password').val()
                            },
                            success: function(updateResponse) {
                                const alertDiv = $('#alertMessage');
                                alertDiv.removeClass('alert-danger alert-success');

                                if (updateResponse.success) {
                                    alertDiv.addClass('alert-success');
                                    alertDiv.html('<strong>Success!</strong> ' + updateResponse.message);
                                    alertDiv.fadeIn();

                                    setTimeout(function() {
                                        window.location.href = updateResponse.redirect || '{{ url_for("signin") }}';
                                    }, 2000);
                                } else {
                                    alertDiv.addClass('alert-danger');
                                    alertDiv.html('<strong>Error!</strong> ' + updateResponse.message);
                                    alertDiv.fadeIn();

                                    submitBtn.html(originalText);
                                    submitBtn.prop('disabled', false);

                                    setTimeout(() => alertDiv.fadeOut(), 3000);
                                }
                            },
                            error: function() {
                                const alertDiv = $('#alertMessage');
                                alertDiv.removeClass('alert-success').addClass('alert-danger');
                                alertDiv.html('<strong>Error!</strong> Failed to update password. Please try again.');
                                alertDiv.fadeIn();

                                submitBtn.html(originalText);
                                submitBtn.prop('disabled', false);

                                setTimeout(() => alertDiv.fadeOut(), 3000);
                            }
                        });
                    } else {
                        const alertDiv = $('#alertMessage');
                        alertDiv.removeClass('alert-success').addClass('alert-danger');
                        alertDiv.html('<strong>Error!</strong> ' + response.message);
                        alertDiv.fadeIn();

                        submitBtn.html(originalText);
                        submitBtn.prop('disabled', false);

                        setTimeout(() => alertDiv.fadeOut(), 3000);
                    }
                },
                error: function() {
                    const alertDiv = $('#alertMessage');
                    alertDiv.removeClass('alert-success').addClass('alert-danger');
                    alertDiv.html('<strong>Error!</strong> Something went wrong. Please try again.');
                    alertDiv.fadeIn();

                    submitBtn.html(originalText);
                    submitBtn.prop('disabled', false);

                    setTimeout(() => alertDiv.fadeOut(), 3000);
                }
            });
        });
    </script>
</body>
</html>
